name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require a stable version tag
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Invalid release tag: %s; expected vX.Y.Z without leading zeros.\n' "$RELEASE_VERSION" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    needs: validate-tag
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build release archive
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          mkdir -p dist
          archive_name="nats-mcp-${TARGET_OS}-${TARGET_ARCH}.tar.gz"
          GOOS="${TARGET_OS}" GOARCH="${TARGET_ARCH}" CGO_ENABLED=0 \
            go build -trimpath \
              -ldflags="-s -w -X github.com/nats-mcp/nats-mcp/internal/version.Version=${RELEASE_VERSION}" \
              -o dist/nats-mcp ./cmd/nats-mcp
          tar -czf "dist/${archive_name}" -C dist nats-mcp
          rm -f dist/nats-mcp

      - name: Verify archived binary version matches tag
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          # Version queries must work without a reachable NATS server.
          NATS_URL: "://invalid"
          NATS_CREDS: /nonexistent/nats.creds
        run: |
          set -euo pipefail
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          tar -xzf "dist/nats-mcp-${TARGET_OS}-${TARGET_ARCH}.tar.gz" -C "$verify_dir"
          actual="$("$verify_dir/nats-mcp" --version)"
          expected="nats-mcp ${RELEASE_VERSION}"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Version mismatch: expected "%s", got "%s".\n' "$expected" "$actual" >&2
            exit 1
          fi
          printf 'Verified: %s (%s/%s)\n' "$actual" "$TARGET_OS" "$TARGET_ARCH"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/nats-mcp-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -eu
          cd dist
          sha256sum nats-mcp-*.tar.gz > checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/nats-mcp-*.tar.gz
            dist/checksums.txt
